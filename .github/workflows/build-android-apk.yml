name: Build and Publish Android Test APK

# Builds the Valdi AAR from a pinned Snapchat/Valdi revision, builds the *test* (debug)
# APK with it, and publishes that APK to the repository's Releases.
#
# Only the debug variant is built: Gradle signs it with the debug keystore, so no signing
# secrets are needed. `applicationId` keeps the `.dev` suffix of the debug variant.
#
# The pinned NDK API level in `VALDI_NDK_API_LEVEL` is what keeps the exported library
# loadable on the app's minimum Android version (see the "Pin Valdi hermetic NDK" step).

on:
  # The exported AAR is committed under core/valdi/libs, so a push builds the test APK
  # straight away (~10 minutes) instead of exporting the AAR first (which takes ~1.5 h).
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:
    # Optional: point a manual run at a different AAR (aar_url = published for the current
    # tag's release asset, or a full URL). The exported-from-source path is kept but
    # disabled - see the `if: ${{ false }}` steps below.
    inputs:
      tag_name:
        description: 'Release tag (for example v0.0.1-beta.5); left empty it is read from the version catalog'
        required: false
        default: ''
      aar_url:
        description: 'Reuse a published AAR instead of exporting one: "published" = the current version tag asset, or a full URL. Empty = export from source (~1.5 h).'
        required: false
        default: ''
      draft:
        description: 'Create the release as a draft'
        type: boolean
        default: false
      prerelease:
        description: 'Mark the release as a pre-release'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: android-test-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Build configuration comes from the repository variables
# (Settings → Secrets and variables → Actions → Variables tab), so the values can be
# changed without touching this file. Each one falls back to the validated default.
env:
  VALDI_CLI_VERSION: ${{ vars.VALDI_CLI_VERSION || '1.2.0' }}
  # Latest *release* of Snapchat/Valdi (tag `beta-0.2.0`, cf9db941f7f2), not a main-branch
  # commit: `git ls-remote --tags https://github.com/Snapchat/Valdi.git` lists 6 tags, this is
  # the newest. Bumped from the 3d0b98c commit because the DIL engine modules extracted from
  # the ChatGPT APK carry precompiled JS bytecode that the older build rejects at evaluation
  # time with "Incorrect magic number".
  VALDI_FRAMEWORK_REF: ${{ vars.VALDI_FRAMEWORK_REF || 'beta-0.2.0' }}
  # Must stay <= the app's minSdk (gradle/libs.versions.toml). Valdi's hermetic NDK
  # defaults to api_level 31, which links API 30+ libc symbols such as
  # pthread_cond_clockwait and makes the exported .so unloadable on API < 30 devices.
  VALDI_NDK_API_LEVEL: ${{ vars.VALDI_NDK_API_LEVEL || '28' }}
  AAR_PATH: ${{ vars.VALDI_AAR_PATH || 'core/valdi/libs/my_application_valdi_export.aar' }}

jobs:
  build-android:
    name: Build Valdi AAR and Test APK
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: Checkout application
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version tag
        id: version
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            VERSION=$(grep -E '^appVersionName' gradle/libs.versions.toml | sed -E 's/.*"([^"]+)".*/\1/')
            TAG="v${VERSION}"
          fi
          echo "TARGET_TAG=$TAG" >> "$GITHUB_ENV"
          # Version catalog tags carry a pre-release suffix (v0.0.1-beta.4).
          if [[ "$TAG" == *-* ]]; then
            echo "PRERELEASE=true" >> "$GITHUB_ENV"
          else
            echo "PRERELEASE=false" >> "$GITHUB_ENV"
          fi
          echo "Using version tag: $TAG"

      # The AAR export takes ~1.5 h, so it can be skipped by reusing the AAR published by a
      # previous run (release asset). The APK build itself only needs the AAR, not the framework.
      - name: Decide AAR source
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.aar_url }}" ]; then
            URL="${{ github.event.inputs.aar_url }}"
            if [ "$URL" = "published" ]; then
              URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TARGET_TAG}/my_application_valdi_export.aar"
            fi
            echo "SKIP_EXPORT=true" >> "$GITHUB_ENV"
            echo "AAR_DOWNLOAD_URL=$URL" >> "$GITHUB_ENV"
            echo "Reusing published AAR: $URL"
          else
            echo "SKIP_EXPORT=false" >> "$GITHUB_ENV"
            echo "Exporting the AAR from source (about 1.5 hours)"
          fi

      - name: Checkout Valdi framework
        uses: actions/checkout@v4
        with:
          repository: Snapchat/Valdi
          ref: ${{ env.VALDI_FRAMEWORK_REF }}
          path: .valdi-framework
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Valdi's Bazel build runs under JDK 17; the Android Gradle project uses JDK 21
      # (switched back to 21 further down, right before Gradle runs).
      - name: Set up JDK 17 for Valdi
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Accept Android SDK licenses and install API 37
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          # Process substitution avoids a broken-pipe exit when sdkmanager finishes
          # reading licenses before the `yes` process exits.
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses < <(yes)
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install \
            'platforms;android-37.0' \
            'build-tools;37.0.0' \
            'platform-tools'

      - name: Prepare Valdi Linux build environment
        working-directory: .valdi-framework
        run: bash tools/ci/setup_linux_env.sh

      - name: Install Valdi CLI
        run: npm install --global @snap/valdi@${VALDI_CLI_VERSION}

      - name: Copy application Valdi module into the framework workspace
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="$GITHUB_WORKSPACE/valdi/apps/my_application_valdi"
          TARGET="$GITHUB_WORKSPACE/.valdi-framework/apps/my_application_valdi"
          test -d "$SOURCE"
          mkdir -p "$TARGET"
          cp -a "$SOURCE/." "$TARGET/"

      # Valdi configures the hermetic Android *SDK* api_level (36) in its MODULE.bazel, but the
      # hermetic *NDK* falls back to its default of 31. That default links symbols added in
      # API 30, which the app cannot load on older devices. Pin it to the app's minSdk.
      - name: Pin Valdi hermetic NDK API level
        shell: bash
        run: |
          set -euo pipefail
          MODULE_FILE="$GITHUB_WORKSPACE/.valdi-framework/MODULE.bazel"
          test -f "$MODULE_FILE"
          if grep -q 'hermetic_ndk_extension.configure' "$MODULE_FILE"; then
            echo "hermetic_ndk_extension already configured; leaving it untouched"
            exit 0
          fi
          # Written with printf: a heredoc body would have to be indented for YAML and the
          # indentation would then leak into Starlark, which is indentation-sensitive.
          {
            echo ""
            echo "# --- injected by the application CI ---"
            echo "# Target the libc of the oldest Android version the app supports (minSdk ${VALDI_NDK_API_LEVEL})."
            echo "hermetic_ndk_extension.configure(api_level = ${VALDI_NDK_API_LEVEL})"
          } >> "$MODULE_FILE"
          echo "Appended NDK api_level=${VALDI_NDK_API_LEVEL} to $MODULE_FILE"
          tail -n 5 "$MODULE_FILE"

      - name: Export Valdi Android AAR
        if: env.SKIP_EXPORT != 'true'
        working-directory: .valdi-framework
        shell: bash
        run: |
          set -euo pipefail
          valdi --version
          valdi export android \
            --library=//apps/my_application_valdi:my_application_valdi_export_android \
            --output_path="$GITHUB_WORKSPACE/$AAR_PATH"
          test -s "$GITHUB_WORKSPACE/$AAR_PATH"

      - name: Download prebuilt AAR
        if: env.SKIP_EXPORT == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$AAR_PATH")"
          curl -fL --retry 3 -o "$AAR_PATH" "$AAR_DOWNLOAD_URL"
          test -s "$AAR_PATH"
          ls -lh "$AAR_PATH"

      # The exported AAR is a "fat" artifact: it also carries javax.inject, which the app
      # depends on itself. Left as-is, :app:checkDebugDuplicateClasses fails on the
      # duplicated classes. Applies to exported *and* reused AARs, so it runs always.
      - name: Strip bundled javax.inject from the AAR
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/strip_aar_duplicates.py "$AAR_PATH"
          ls -lh "$AAR_PATH"

      # Fail here instead of on a device: the APK cannot load the library if it references
      # libc symbols that only exist on newer Android versions.
      - name: Verify exported library targets the app minSdk
        shell: bash
        run: |
          set -euo pipefail
          WORK=$(mktemp -d)
          unzip -o -q "$AAR_PATH" 'jni/arm64-v8a/*' -d "$WORK"
          SO=$(find "$WORK" -name '*.so' | head -n 1)
          test -n "$SO"
          echo "Exported library: $SO"
          if readelf --dyn-syms -W "$SO" 2>/dev/null | grep -q 'pthread_cond_clockwait'; then
            echo "::error::$SO references pthread_cond_clockwait (added in API 30) while the app targets an older minSdk; System.loadLibrary would fail with UnsatisfiedLinkError. Keep VALDI_NDK_API_LEVEL at or below the app minSdk."
            exit 1
          fi
          echo "OK: no API-30+ libc-only symbols referenced."

      - name: Set up JDK 21 for Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # Test build: the debug variant is signed by Gradle with the debug keystore.
      - name: Build test (debug) APK
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Collect and rename APK
        run: |
          set -euo pipefail
          mkdir -p output
          TAG="${TARGET_TAG}"
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::No debug APK generated"
            exit 1
          fi
          cp "$APK" "output/MyApplicationValdi-test-${TAG}.apk"
          sha256sum "output/MyApplicationValdi-test-${TAG}.apk" \
            > "output/MyApplicationValdi-test-${TAG}.apk.sha256"
          ls -l output
          echo "APK_FILE=output/MyApplicationValdi-test-${TAG}.apk" >> "$GITHUB_ENV"
          echo "SHA_FILE=output/MyApplicationValdi-test-${TAG}.apk.sha256" >> "$GITHUB_ENV"

      - name: Generate changelog
        id: changelog
        run: |
          set -euo pipefail
          CURRENT_TAG="${TARGET_TAG}"
          PREV_TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+' | sed -n '2p' || true)
          echo "Current tag: $CURRENT_TAG, previous tag: ${PREV_TAG:-<none>}"

          if git rev-parse "$CURRENT_TAG" >/dev/null 2>&1; then
            CURRENT_REF="$CURRENT_TAG"
          else
            CURRENT_REF="HEAD"
          fi

          if [ -z "$PREV_TAG" ]; then
            LOG=$(git log -n 50 --pretty=format:"- %s (%h)" "$CURRENT_REF")
          else
            LOG=$(git log --pretty=format:"- %s (%h)" "${PREV_TAG}..${CURRENT_REF}")
          fi

          FEAT=$(echo "$LOG" | grep -i "^- feat" || true)
          FIX=$(echo "$LOG" | grep -i "^- fix" || true)
          PERF=$(echo "$LOG" | grep -i "^- perf\|^- refactor\|^- improve" || true)
          CHORE=$(echo "$LOG" | grep -Eiv "^- feat|^- fix|^- perf|^- refactor|^- improve" || true)

          {
            echo "## My Application Valdi ${CURRENT_TAG}"
            echo ""
            echo "> **测试包（debug variant）** —— 由 CI 构建并自动发布，用于真机测试；"
            echo "> 包名为 \`com.example.myapplication.dev\`，由 Gradle 的 debug keystore 签名。"
            echo ""
            echo "Valdi \`${VALDI_FRAMEWORK_REF}\` + CLI \`@snap/valdi@${VALDI_CLI_VERSION}\`；"
            echo "导出的原生库面向 Android API ${VALDI_NDK_API_LEVEL}+。"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              echo "> Everything that changed since \`$PREV_TAG\`"
              echo ""
            fi
            if [ -n "$FEAT" ]; then
              echo "### ✨ Features"
              echo "$FEAT"
              echo ""
            fi
            if [ -n "$FIX" ]; then
              echo "### 🐛 Fixes"
              echo "$FIX"
              echo ""
            fi
            if [ -n "$PERF" ]; then
              echo "### ⚡ Performance and refactoring"
              echo "$PERF"
              echo ""
            fi
            if [ -n "$CHORE" ]; then
              echo "### 🔧 Other changes"
              echo "$CHORE"
              echo ""
            fi
            echo "---"
            echo ""
            echo "**APK**"
            echo "\`\`\`"
            cat "$SHA_FILE"
            echo "\`\`\`"
          } > release_notes.md

          echo "RELEASE_NOTES_FILE=release_notes.md" >> "$GITHUB_ENV"

      - name: Publish test APK to GitHub Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TARGET_TAG }}
          name: 'My Application Valdi ${{ env.TARGET_TAG }} (test)'
          body_path: ${{ env.RELEASE_NOTES_FILE }}
          files: |
            ${{ env.APK_FILE }}
            ${{ env.SHA_FILE }}
            ${{ env.AAR_PATH }}
          draft: ${{ github.event.inputs.draft == 'true' }}
          prerelease: ${{ env.PRERELEASE == 'true' || github.event.inputs.prerelease == 'true' }}
          # Only a non pre-release build may take over the "latest" marker.
          make_latest: ${{ env.PRERELEASE != 'true' }}
        env:
          # 仓库设置里配置的 secret（Settings → Secrets and variables → Actions）；
          # 不要在这里写死令牌。用 PAT 而非默认 GITHUB_TOKEN，方便后续需要它触发其它工作流。
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
